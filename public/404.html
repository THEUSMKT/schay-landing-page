<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Schay Corretora</title>
    <script>
      // Truque padrão para SPA em GitHub Pages (github.com/rafgraph/spa-github-pages):
      // o GitHub Pages não sabe rotear /apartamentos, /casas etc. no servidor,
      // então esse 404.html reescreve a URL como query string e redireciona
      // para o index.html, que devolve a rota original (ver script equivalente
      // em index.html). Não tem efeito em hosts com rewrite de verdade
      // (Netlify/Vercel), que nunca chegam a servir este arquivo.
      var pathSegmentsToKeep = 1 // /schay-landing-page/

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
