name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/schay-corretora-landing-ik13gf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Onde o GitHub Pages serve o site, lido da própria configuração do
      # Pages: sem domínio próprio, é o "Project Pages" em
      # theusmkt.github.io/<repositorio>/ (base_path "/schay-landing-page");
      # com o domínio próprio (schaycorretora.com.br) configurado em
      # Settings → Pages, é a raiz (base_path ""). O build se ajusta sozinho
      # às duas situações — depois de trocar o domínio no Pages, basta
      # publicar de novo (Actions → "Deploy to GitHub Pages" → Run workflow).
      # Netlify e Vercel não usam este workflow e servem sempre da raiz.
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm run build -- --base=${{ steps.pages.outputs.base_path }}/

      # Baixa só o Chromium (não Firefox/WebKit) — é o único navegador que o
      # script de prerender usa. Ver scripts/prerender.mjs pro porquê da
      # pré-renderização existir.
      - run: npx playwright install --with-deps chromium

      # --site-url: endereço público usado no canonical, nas tags de
      # compartilhamento, no JSON-LD, no sitemap.xml e no robots.txt.
      - run: npm run prerender -- --base=${{ steps.pages.outputs.base_path }}/ --site-url=${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
