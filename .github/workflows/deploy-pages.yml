name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/schay-corretora-landing-ik13gf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --base precisa bater com o nome do repositório, já que o GitHub
      # Pages serve um "Project Pages" em /<repositorio>/. Netlify e Vercel
      # não usam este workflow, então continuam servindo a partir de "/".
      - run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
