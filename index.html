<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Contraparte do redirecionamento feito em public/404.html: se a URL
      // veio daquele truque (GitHub Pages, sem rewrite de servidor),
      // reconstrói a rota original antes do React montar. Em hosts com
      // rewrite de verdade (Netlify/Vercel) isso nunca é acionado.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1526" />
    <meta
      name="description"
      content="Schay Corretora — imóveis à venda em São Leopoldo e região. Casas, apartamentos e terrenos com atendimento próximo, do primeiro contato à entrega das chaves. CRECI 83.933F."
    />
    <title>Schay Corretora | Imóveis à venda em São Leopoldo e região</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
